<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - MecaLink</title>
</head>

<body>

    <header>
        <h1>MecaLink</h1>
        <p>Connect. Repair. Drive.</p>

        <nav>
            <a href="../index.html">Home</a>
            <a href="registration.html">Register</a>
            <a href="mechanics.html">Find a Mechanic</a>
            <a href="help.html">Get Help</a>
            <a href="community.html">Community</a>
            <a href="marketplace.html">Marketplace</a>
        </nav>
    </header>

    <main>

        <h2>Create Your MecaLink Account</h2>

        <p>
            Register to connect with mechanics, vehicle owners and sellers.
        </p>

        <form>

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name">

            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email">

            <br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">

            <br><br>

            <label for="role">I am a:</label>
            <select id="role" name="role">
                <option value="">Select your role</option>
                <option value="vehicle-owner">Vehicle Owner</option>
                <option value="mechanic">Mechanic</option>
                <option value="seller">Seller / Business</option>
            </select>

            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Create a password">

            <br><br>

            <button type="submit">Create Account</button>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 MecaLink. All rights reserved.</p>
    </footer>

</body>
</html>
