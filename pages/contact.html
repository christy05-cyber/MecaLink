</head>
<body>

<header class="site-header">
  <div class="brand">
    <img src="../images/logo.png" class="logo-img" alt="Logo">
    <div><h1>MecaLink</h1><p>Connect. Repair. Drive.</p></div>
  </div>
  <nav>
    <a href="../index.html">Home</a>
    <a href="register.html">Register</a>

<section class="location-hero">
  <div class="location-intro">
    <h2>Get In <span>Touch</span></h2>
    <p>Have questions? Contact us</p>
  </div>
</section>

<section class="location-section">
  <div class="location-container" style="max-width:600px;">
    <div class="location-card">
      <h3>Contact Form</h3>
      <form>
        <div class="location-form-group"><label>Your Name</label><input type="text" placeholder="Enter name"></div>
        <div class="location-form-group"><label>Email</label><input type="email" placeholder="Enter email"></div>
        <div class="location-form-group"><label>Message</label><textarea style="width:100%; padding:15px; border:1px solid #d8e0e8; border-radius:9px;" rows="5" placeholder="Your message"></textarea></div>
        <button type="submit" class="location-button">Send Message</button>
      </form>
    </div>
  </div>
</section>
